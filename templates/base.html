{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="{% static 'images/favicon.png' %}?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}?v=2">
    {% block meta %}
    {% endblock meta %}
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (_) {}
    </script>
    {% tailwind_css %}
</head>
<body>
    {% include 'components/navbar.html' %}
    {% block content %}
    {% endblock %}
    {% include 'components/footer.html' %}
</body>
</html>
