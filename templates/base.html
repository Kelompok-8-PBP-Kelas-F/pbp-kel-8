{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fef4e0] min-h-screen flex flex-col font-sans text-black selection:bg-orange-300">
    
    <!-- Navbar -->
    <header class="bg-[#f4cc5c] border-b-2 border-black px-6 py-3 flex items-center justify-between z-10 sticky top-0">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-3">
            <div class="bg-black text-white font-bold text-sm w-8 h-8 flex items-center justify-center">OB</div>
            <span class="font-extrabold text-xl">Thrift.io</span>
        </a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex gap-6 font-semibold text-sm">
            <a href="#" class="hover:underline">Marketplace</a>
            <a href="#" class="hover:underline">Event</a>
            <a href="#" class="hover:underline">News</a>
            <a href="#" class="hover:underline">Forum</a>
            <a href="#" class="hover:underline">Outfit Builder</a>
        </nav>

        <!-- Right Actions (Cart & Profile) -->
        <div class="flex items-center gap-3">
            <a href="#" class="flex items-center gap-2 bg-white border-2 border-black px-4 py-1.5 font-bold text-sm shadow-[3px_3px_0px_rgba(0,0,0,1)] hover:bg-gray-100 active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0px_rgba(0,0,0,1)] transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Keranjang
            </a>
            
            <!-- Tombol Marketplace (Statis: Burhan) -->
            <a href="{% url 'core:seller_profile' username='Burhan' %}" class="flex items-center gap-2 bg-white border-2 border-black px-1.5 py-1.5 pr-4 font-bold text-sm shadow-[3px_3px_0px_rgba(0,0,0,1)] hover:bg-gray-100 transition-all">
                <div class="bg-black text-white flex items-center justify-center w-6 h-6 text-xs font-bold">B</div>
                <span>Burhan</span>
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-[#1b4332] text-white/80 border-t-2 border-black px-6 py-4 flex flex-col md:flex-row justify-between items-center text-xs font-medium">
        <div class="mb-2 md:mb-0">
            Outfit Builder · Low-fidelity workspace
        </div>
        <div class="flex gap-6">
            <a href="#" class="hover:text-white transition-colors">Bantuan</a>
            <a href="#" class="hover:text-white transition-colors">Privasi</a>
            <span>Versi 1.0</span>
        </div>
    </footer>

</body>
</html>
