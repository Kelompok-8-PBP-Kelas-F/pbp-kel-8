{% if form.non_field_errors %}
  <div class="border-2 border-red-600 bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950 dark:text-red-200" role="alert">
    {{ form.non_field_errors }}
  </div>
{% endif %}

{% for field in form %}
  <div class="flex flex-col gap-2">
    <label class="text-sm font-bold" for="{{ field.id_for_label }}">
      {{ field.label }}
      {% if field.field.required %}<span class="text-[#d95a2b]">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
      <p class="text-xs text-[#695b3d] dark:text-[#c2b58e]">{{ field.help_text }}</p>
    {% endif %}
    {% for error in field.errors %}
      <p class="text-xs text-red-600 dark:text-red-300" role="alert">{{ error }}</p>
    {% endfor %}
  </div>
{% endfor %}
