{% extends 'base.html' %}

{% block content %}
<main class="w-full min-h-screen bg-background font-main text-foreground p-6 pt-12 flex justify-center">
    <div class="w-full max-w-xl border-2 border-line bg-surface p-6 shadow-[6px_6px_0_var(--shadow-color)]">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="font-heading text-2xl font-bold uppercase text-foreground tracking-wide">{{ title }}</h1>
            <a href="{% url 'marketplace:marketplace_penjual' %}" 
               class="text-xs font-bold border-2 border-line bg-surface px-3 py-1.5 text-foreground shadow-[2px_2px_0_var(--shadow-color)] hover:bg-background transition-colors">
                Kembali
            </a>
        </div>

        <!-- Form Input -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-4">
                    <label class="block text-xs font-bold text-foreground mb-1 uppercase tracking-wider">
                        {{ field.label }}
                    </label>
                    
                    <!-- Input Wrapper (Dark Box + Light Text saat Dark Mode) -->
                    <div class="[&>input]:w-full [&>input]:p-2.5 [&>input]:border-2 [&>input]:border-line [&>input]:!bg-white [&>input]:!text-black [&>input]:font-bold [&>input]:placeholder:!text-gray-500 [&>textarea]:w-full [&>textarea]:p-2.5 [&>textarea]:border-2 [&>textarea]:border-line [&>textarea]:!bg-white [&>textarea]:!text-black [&>textarea]:font-bold [&>textarea]:placeholder:!text-gray-500 [&>select]:w-full [&>select]:p-2.5 [&>select]:border-2 [&>select]:border-line [&>select]:!bg-white [&>select]:!text-black [&>select]:font-bold">
                        {{ field }}
                    </div>

                    {% if field.errors %}
                        <p class="text-xs font-bold text-accent mt-1">{{ field.errors.as_text }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" 
                    class="w-full border-2 border-line bg-accent text-accent-foreground font-bold py-3 mt-4 text-xs uppercase tracking-wider shadow-[3px_3px_0_var(--shadow-color)] hover:opacity-90 active:translate-x-[1px] active:translate-y-[1px] transition-all">
                Simpan Barang
            </button>
        </form>

    </div>
</main>
{% endblock %}
