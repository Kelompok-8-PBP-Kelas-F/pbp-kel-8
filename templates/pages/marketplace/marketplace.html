{% extends 'base.html' %}

{% block meta %}
<title>Marketplace - Thrift.io</title>
{% endblock meta %}

{% block content %}
<main class="w-full min-h-screen bg-background font-main text-foreground">

  <!-- ===== MOBILE FILTER BUTTON ===== -->
  <div class="md:hidden flex items-center gap-2 px-4 pt-4">
    <button id="filter-toggle" class="flex items-center gap-2 px-4 py-2 bg-surface font-bold text-sm border-2 border-line shadow-[3px_3px_0_var(--shadow-color)] cursor-pointer">
      <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Filter & Urutkan
    </button>
  </div>

  <!-- ===== FILTER DRAWER OVERLAY (mobile) ===== -->
  <div id="filter-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden" aria-hidden="true"></div>

  <div class="flex gap-0">

    <!-- ===== SIDEBAR FILTER ===== -->
    <aside id="filter-sidebar" class="fixed md:static top-0 left-0 h-full md:h-auto w-72 md:w-64 z-50 md:z-auto -translate-x-full md:translate-x-0 transition-transform duration-300 shrink-0 border-r-2 border-line bg-background p-5 overflow-y-auto md:self-start md:sticky md:top-0 md:min-h-screen">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-extrabold text-base">Filter produk</h2>
        <button id="filter-close" class="md:hidden text-xl font-bold leading-none cursor-pointer">&times;</button>
      </div>

      <!-- Kategori -->
      <div class="mb-5">
        <h3 class="font-bold text-sm mb-2">Kategori</h3>
        <ul class="text-xs space-y-1">
          <li>
            <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
              <input type="radio" name="category" value="" class="accent-[#E2652B]" checked> Semua
            </label>
          </li>
          {% for cat in categories %}
          <li>
            <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
              <input type="radio" name="category" value="{{ cat.id }}" class="accent-[#E2652B]"> {{ cat.name }}
            </label>
          </li>
          {% endfor %}
        </ul>
      </div>

      <hr class="border-line/20 mb-4">

      <!-- Kondisi -->
      <div class="mb-5">
        <h3 class="font-bold text-sm mb-2">Kondisi</h3>
        <div class="flex flex-col gap-1.5 text-xs">
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="condition" value="" class="accent-[#E2652B]" checked> Semua
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="condition" value="new" class="accent-[#E2652B]"> Baru
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="condition" value="preloved" class="accent-[#E2652B]"> Preloved
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="condition" value="used" class="accent-[#E2652B]"> Bekas
          </label>
        </div>
      </div>

      <hr class="border-line/20 mb-4">

      <!-- Urutkan -->
      <div class="mb-6">
        <h3 class="font-bold text-sm mb-2">Urutkan</h3>
        <div class="flex flex-col gap-1.5 text-xs">
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="sort" value="newest" class="accent-[#E2652B]" checked> Terbaru
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="sort" value="oldest" class="accent-[#E2652B]"> Terlama
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="sort" value="price_asc" class="accent-[#E2652B]"> Harga Terendah
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-semibold">
            <input type="radio" name="sort" value="price_desc" class="accent-[#E2652B]"> Harga Tertinggi
          </label>
        </div>
      </div>

      <!-- Reset -->
      <button id="reset-filters" class="w-full py-2 bg-surface font-bold text-sm border-2 border-line shadow-[3px_3px_0_var(--shadow-color)] hover:opacity-80 transition-all cursor-pointer mb-2">
        Reset Filter
      </button>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="flex-1 p-4 md:p-5 min-w-0">

      <!-- Search Bar -->
      <div class="flex gap-0 mb-4 border-2 border-line shadow-[3px_3px_0_var(--shadow-color)]">
        <div class="flex items-center gap-2 flex-1 bg-surface px-4 py-2.5">
          <svg class="w-4 h-4 shrink-0 text-muted stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="search-input" type="text" placeholder="Cari item, kategori, atau penjual" class="bg-transparent text-sm text-foreground placeholder:text-muted/70 outline-none w-full font-medium">
        </div>
      </div>

      <!-- Listing Header -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-extrabold text-base">Daftar produk</h2>
        <span id="item-count" class="text-xs text-muted font-medium">— listing aktif</span>
      </div>

      <!-- Product Grid -->
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="col-span-full text-center py-16 text-muted font-medium">Memuat...</div>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="flex items-center justify-center gap-3 mt-8 mb-4"></div>

    </div>
  </div>
</main>

<script>
const FILTER_URL = "{% url 'marketplace:filter_barang' %}";
const IS_AUTHENTICATED = {{ user.is_authenticated|yesno:"true,false" }};
const CSRF_TOKEN = "{{ csrf_token }}";
const BG_COLORS = ['bg-[#f09a67]', 'bg-category', 'bg-surface', 'bg-accent'];
let currentPage = 1;

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getFilters() {
  return {
    q: document.getElementById('search-input').value,
    category: document.querySelector('input[name="category"]:checked')?.value || '',
    condition: document.querySelector('input[name="condition"]:checked')?.value || '',
    sort: document.querySelector('input[name="sort"]:checked')?.value || 'newest',
    page: currentPage,
  };
}

function buildCard(item, index) {
  const bg = BG_COLORS[index % BG_COLORS.length];
  const img = item.image_url
    ? `<img src="${esc(item.image_url)}" alt="${esc(item.title)}" class="w-full h-full object-cover">`
    : `<svg class="w-10 h-10 stroke-current fill-none text-foreground/30" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>`;

  const wishlistBtn = IS_AUTHENTICATED
    ? `<form method="post" action="${esc(item.wishlist_url)}" class="wishlist-form">
        <input type="hidden" name="csrfmiddlewaretoken" value="${CSRF_TOKEN}">
        <button type="submit" class="px-2 py-2 border-2 border-line shadow-[2px_2px_0_var(--shadow-color)] hover:opacity-95 transition-all cursor-pointer ${item.wishlisted ? 'bg-accent text-accent-foreground' : 'bg-surface'}">♥</button>
      </form>`
    : '';

  return `
    <div class="bg-surface border-2 border-line shadow-[3px_3px_0_var(--shadow-color)] flex flex-col">
      <div class="w-full aspect-[3/4] border-b-2 border-line flex items-center justify-center overflow-hidden ${bg}">
        ${img}
      </div>
      <a href="${esc(item.detail_url)}" class="p-3 flex flex-col gap-1 flex-1 hover:underline">
        <p class="text-sm font-bold text-foreground leading-tight line-clamp-2">${esc(item.title)}</p>
        <p class="text-xs text-muted truncate">${esc(item.condition)} · ${esc(item.seller)}</p>
        <p class="text-sm font-extrabold text-foreground mt-auto pt-1">Rp ${Number(item.price).toLocaleString('id-ID')}</p>
      </a>
      <div class="px-3 pb-3 flex gap-2">
        <a href="${esc(item.detail_url)}" class="flex-1 py-2 text-center bg-accent text-accent-foreground font-bold text-xs border-2 border-line shadow-[2px_2px_0_var(--shadow-color)] hover:opacity-95 transition-all">
          Lihat Barang
        </a>
        ${wishlistBtn}
      </div>
    </div>`;
}

function renderGrid(items, meta) {
  const grid = document.getElementById('product-grid');
  document.getElementById('item-count').textContent = `${meta.count} listing aktif`;
  if (!items.length) {
    grid.innerHTML = '<div class="col-span-full text-center py-16 text-muted font-medium">Tidak ada item yang ditemukan.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  grid.innerHTML = items.map((item, i) => buildCard(item, i)).join('');

  // Pagination controls
  let pg = '';
  if (meta.has_prev) pg += `<button onclick="goPage(${meta.page - 1})" class="px-4 py-2 border-2 border-line bg-surface font-bold text-xs shadow-[2px_2px_0_var(--shadow-color)] hover:opacity-80 cursor-pointer">← Sebelumnya</button>`;
  pg += `<span class="px-3 py-2 text-xs font-semibold text-muted">Halaman ${meta.page} / ${meta.num_pages}</span>`;
  if (meta.has_next) pg += `<button onclick="goPage(${meta.page + 1})" class="px-4 py-2 border-2 border-line bg-surface font-bold text-xs shadow-[2px_2px_0_var(--shadow-color)] hover:opacity-80 cursor-pointer">Selanjutnya →</button>`;
  document.getElementById('pagination').innerHTML = pg;

  // Attach AJAX wishlist toggle to each form
  grid.querySelectorAll('.wishlist-form').forEach(form => {
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = form.querySelector('button');
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' },
        body: new FormData(form),
      });
      const data = await res.json();
      btn.classList.toggle('bg-accent', data.wishlisted);
      btn.classList.toggle('text-accent-foreground', data.wishlisted);
      btn.classList.toggle('bg-surface', !data.wishlisted);
    });
  });
}

async function fetchItems() {
  const params = new URLSearchParams(getFilters());
  const res = await fetch(`${FILTER_URL}?${params}`);
  const data = await res.json();
  renderGrid(data.items, data);
}

function goPage(page) {
  currentPage = page;
  fetchItems();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Debounce helper
function debounce(fn, delay) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
}

const debouncedFetch = debounce(fetchItems, 300);

// Wire up inputs
document.getElementById('search-input').addEventListener('input', () => { currentPage = 1; debouncedFetch(); });
document.querySelectorAll('input[name="category"], input[name="condition"], input[name="sort"]')
  .forEach(el => el.addEventListener('change', () => { currentPage = 1; fetchItems(); }));

document.getElementById('reset-filters').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.querySelector('input[name="category"][value=""]').checked = true;
  document.querySelector('input[name="condition"][value=""]').checked = true;
  document.querySelector('input[name="sort"][value="newest"]').checked = true;
  currentPage = 1;
  fetchItems();
});

// Initial load
fetchItems();

// ===== MOBILE FILTER DRAWER =====
const sidebar = document.getElementById('filter-sidebar');
const overlay = document.getElementById('filter-overlay');

function openDrawer() {
  sidebar.classList.remove('-translate-x-full');
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  sidebar.classList.add('-translate-x-full');
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}

document.getElementById('filter-toggle').addEventListener('click', openDrawer);
document.getElementById('filter-close').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);

// Close drawer on filter change (mobile UX)
document.querySelectorAll('input[name="category"], input[name="condition"], input[name="sort"]')
  .forEach(el => el.addEventListener('change', () => {
    if (window.innerWidth < 768) closeDrawer();
  }));
</script>
{% endblock content %}
