<dialog
  id="news-warning-modal"
  aria-labelledby="news-warning-title"
  class="m-auto w-[calc(100%-2rem)] max-w-md border-2 border-line bg-surface p-0 text-foreground shadow-[6px_6px_0_var(--shadow-color)] backdrop:bg-black/60"
>
  <div class="p-6 sm:p-8">
    <h2 id="news-warning-title" class="font-heading text-2xl font-bold">
      Anda akan membuka website lain
    </h2>
    <p class="mt-3 text-sm leading-relaxed text-muted">
      Anda akan diarahkan ke situs lain untuk membaca artikel ini.
    </p>
    <div class="mt-6 flex flex-col-reverse justify-end gap-3 sm:flex-row">
      <form method="dialog">
        <button
          type="submit"
          class="inline-flex min-h-11 w-full items-center justify-center border-2 border-line px-5 font-semibold text-foreground transition-colors hover:bg-background focus:outline-none focus:ring-2 focus:ring-accent sm:w-auto"
        >
          Batal
        </button>
      </form>
      <a
        id="news-warning-continue"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex min-h-11 items-center justify-center border-2 border-line bg-hero px-5 font-bold text-hero-foreground shadow-[3px_3px_0_var(--shadow-color)] transition-transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-accent"
      >
        Lanjutkan
      </a>
    </div>
  </div>
</dialog>

<script>
  (() => {
    const warningModal = document.getElementById("news-warning-modal");
    const continueLink = document.getElementById("news-warning-continue");

    if (!warningModal || !continueLink) {
      return;
    }

    document.querySelectorAll(".news-article-link").forEach((articleLink) => {
      articleLink.addEventListener("click", (event) => {
        event.preventDefault();
        continueLink.href = articleLink.href;
        warningModal.showModal();
      });
    });

    warningModal.addEventListener("close", () => {
      continueLink.removeAttribute("href");
    });
  })();
</script>
