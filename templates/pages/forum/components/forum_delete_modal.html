<!-- Delete Confirmation Modal Component -->
<div
  id="delete-confirm-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-xs transition-opacity duration-200"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-modal-title"
>
  <div
    class="relative w-full max-w-md border-2 border-line bg-surface p-6 shadow-[5px_5px_0_var(--shadow-color)]"
    id="delete-modal-box"
  >
    <!-- Header / Icon & Content -->
    <div class="flex items-start gap-4">
      <div class="grid size-10 shrink-0 place-items-center border-2 border-line bg-red-100 text-red-600 shadow-[2px_2px_0_var(--shadow-color)]">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" x2="10" y1="11" y2="17"/>
          <line x1="14" x2="14" y1="11" y2="17"/>
        </svg>
      </div>

      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <h3 id="delete-modal-title" class="font-heading text-lg font-bold leading-snug text-foreground">
          Konfirmasi Hapus
        </h3>
        <p id="delete-modal-description" class="text-xs sm:text-[0.8125rem] leading-relaxed text-muted">
          Apakah kamu yakin ingin menghapus item ini? Tindakan ini tidak dapat dibatalkan.
        </p>
      </div>
    </div>

    <!-- Error message banner if API call fails -->
    <div
      id="delete-modal-error"
      class="mt-4 hidden border-2 border-red-600 bg-red-50 p-2.5 text-xs font-semibold text-red-700"
      role="alert"
    ></div>

    <!-- Action buttons -->
    <div class="mt-6 flex flex-col-reverse sm:flex-row items-center justify-end gap-2.5 sm:gap-3">
      <button
        type="button"
        id="delete-modal-cancel-btn"
        class="w-full sm:w-auto inline-flex min-h-9 items-center justify-center border-2 border-line bg-background px-4 py-1.5 text-xs font-bold text-foreground shadow-[2px_2px_0_var(--shadow-color)] transition-all hover:bg-surface active:translate-x-0.5 active:translate-y-0.5 active:shadow-[1px_1px_0_var(--shadow-color)] cursor-pointer"
      >
        Batal
      </button>
      <button
        type="button"
        id="delete-modal-confirm-btn"
        class="w-full sm:w-auto inline-flex min-h-9 items-center justify-center gap-2 border-2 border-line bg-red-600 px-4 py-1.5 text-xs font-bold text-white shadow-[2px_2px_0_var(--shadow-color)] transition-all hover:bg-red-700 active:translate-x-0.5 active:translate-y-0.5 active:shadow-[1px_1px_0_var(--shadow-color)] cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <svg class="delete-spinner hidden size-3.5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <span class="delete-btn-text">Hapus</span>
      </button>
    </div>
  </div>
</div>
