{% extends 'base.html' %}

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  {% block content %}
  <main>
    <section class="bg-amber-50 px-[10px] py-[12px] border-r-2 border-[#111] flex flex-col gap-[8px] min-w-0" >
        <div class="flex justify-between items-center font-bold text-[11px] gap-[8px] flex-wrap">
            <span id="cinfo">
                KANVAS OUTFIT
            </span>
            <span class="flex gap-[6px] items-center font-normal">
                <button id="zv" aria-label="Perkecil">-</button>
                <span id="zv">100%</span>
                <button id="zi" aria-label="Perbesar">+</button>
                <button id="gr" aria-pressed="true">Grid: aktif</button>
                <button id="rs">Acak</button>
            </span>
        </div>
        <div class="relative-1 min-h-[560px] overflow-auto border-[2px] border-[#111] bg-[#1f4a3a]" 
        id="bg-[linear-gradient(rgba(255,255,255,.07)_1px,transparent_1px), linear-gradient(90deg,rgba(255,255,255,.07)_1px,transparent_1px)] bg-[size:24px_24px]">
            <span class="absolute left-[14px] top-[12px] text-[#f2be4a] text-[10px]">
                [ AREA MIX-AND-MATCH ]
            </span>
            <div class="flex flex-col items-center gap-[14px] px-[20px] pt-[60px] pb-[30px] origin-top transition-transform duration-150">
                <div class="grid grid-cols-[22px_150px_22px] gap-[70px] items-center justify-center">
                    
                </div>

                <div class="grid grid-cols-[22px_150px_22px] gap-[70px] items-center justify-center">

                </div>

                <div class="grid grid-cols-[22px_150px_22px] gap-[70px] items-center justify-center">

                </div>

                <div class="grid grid-cols-[22px_150px_22px] gap-[70px] items-center justify-center">

                </div>

            </div>
        </div>
    </section>
  </main>
  {% endblock %}
</html>
