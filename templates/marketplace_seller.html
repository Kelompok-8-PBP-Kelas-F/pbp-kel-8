{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto mt-8 p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Marketplace Penjual</h1>
        <a href="{% url 'core:tambah_barang' %}" class="bg-orange-600 text-white px-4 py-2 rounded shadow hover:bg-orange-700">Tambah Barang</a>
    </div>

    <!-- Filter & Search Bar -->
    <div class="mb-6 flex gap-4">
        <input type="text" id="searchInput" placeholder="Cari barangmu..." class="border p-2 rounded w-1/2 shadow-sm">
        <select id="statusFilter" class="border p-2 rounded shadow-sm">
            <option value="">Semua Status</option>
            <option value="Tersedia">Masih Tersedia</option>
            <option value="Terjual">Terjual</option>
        </select>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Render awal dari Django -->
        {% for item in items %}
        <div class="border-2 border-black rounded shadow-[4px_4px_0px_rgba(0,0,0,1)] bg-orange-100 overflow-hidden">
            {% if item.gambar %}
            <img src="{{ item.gambar.url }}" alt="{{ item.nama }}" class="w-full h-48 object-cover border-b-2 border-black">
            {% endif %}
            <div class="p-4 bg-white">
                <h3 class="font-bold text-lg truncate">{{ item.nama }}</h3>
                <p class="text-gray-700 mb-2">Rp{{ item.harga }}</p>
                <span class="text-xs px-2 py-1 bg-gray-200 border border-black rounded">{{ item.status }}</span>
                
                <div class="mt-4 flex justify-between gap-2">
                    <a href="{% url 'core:edit_barang' item.id %}" class="flex-1 text-center bg-yellow-400 border-2 border-black font-bold py-1 hover:bg-yellow-500">Edit</a>
                    <form action="{% url 'core:hapus_barang' item.id %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-center bg-red-500 text-white border-2 border-black font-bold py-1 hover:bg-red-600">Hapus</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- AJAX Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const productGrid = document.getElementById('productGrid');

    function fetchItems() {
        const query = searchInput.value;
        const status = statusFilter.value;
        
        fetch(`/ajax-filter-barang/?q=${query}&status=${status}`)
            .then(response => response.json())
            .then(data => {
                productGrid.innerHTML = ''; // Bersihkan grid
                data.items.forEach(item => {
                    const csrfToken = '{{ csrf_token }}';
                    const card = `
                        <div class="border-2 border-black rounded shadow-[4px_4px_0px_rgba(0,0,0,1)] bg-orange-100 overflow-hidden">
                            <img src="${item.gambar_url}" alt="${item.nama}" class="w-full h-48 object-cover border-b-2 border-black">
                            <div class="p-4 bg-white">
                                <h3 class="font-bold text-lg truncate">${item.nama}</h3>
                                <p class="text-gray-700 mb-2">Rp${item.harga}</p>
                                <span class="text-xs px-2 py-1 bg-gray-200 border border-black rounded">${item.status}</span>
                                
                                <div class="mt-4 flex justify-between gap-2">
                                    <a href="/edit/${item.id}/" class="flex-1 text-center bg-yellow-400 border-2 border-black font-bold py-1 hover:bg-yellow-500">Edit</a>
                                    <form action="/hapus/${item.id}/" method="POST" class="flex-1">
                                        <input type="hidden" name="csrfmiddlewaretoken" value="${csrfToken}">
                                        <button type="submit" class="w-full text-center bg-red-500 text-white border-2 border-black font-bold py-1 hover:bg-red-600">Hapus</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    `;
                    productGrid.innerHTML += card;
                });
            });
    }

    searchInput.addEventListener('keyup', fetchItems);
    statusFilter.addEventListener('change', fetchItems);
});
</script>
{% endblock %}
